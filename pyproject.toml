[project]
name = "hybrid-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blackjax>=1.2.5",
    "diffrax>=0.6.1",
    "equinox>=0.11.10",
    "gitpython>=3.1.44",
    "jax[cpu]>=0.4.37",
    "jaxley>=0.5.0",
    "jaxley-mech>=0.3.1",
    "optax>=0.2.4",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbdime>=4.0.2",
    "neuron>=9.0.1",
    "pytest>=9.0.2",
    "ruff>=0.11.9",
    "seaborn>=0.13.2",
    "ty>=0.0.1a19",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["./"]
include = ["hybrid_models"]
